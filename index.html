<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inducción a Wix · Docentes IE · Crack the Code</title>
<style>
@font-face{font-family:'NT Bau';src:url(fonts/NTBau-Regular.otf);font-weight:400}
@font-face{font-family:'NT Bau';src:url(fonts/NTBau-Medium.otf);font-weight:500}
@font-face{font-family:'NT Bau';src:url(fonts/NTBau-Bold.otf);font-weight:700}
@font-face{font-family:'Roca One';src:url(fonts/RocaOne-Lt.ttf)}
:root{--dk:#001F19;--o:#B4571A;--ol:#FF9C65;--o1:#FFF1E8;--ob:#F1D9C8;--ok:#12996B;--ok1:#EAF7F1;--bad:#D8524B;--bad1:#FDECEB;--mu:#5C5C5C;--tx:#262626;--bg:#FBF6F1;--mi:#6BE3D7;--oh:#9A4914}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'NT Bau',Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--o)}a:hover{color:var(--dk)}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--ol);outline-offset:2px}
.app{min-height:100vh;display:flex;flex-direction:column}
.hud{position:sticky;top:0;z-index:50;background:var(--dk);color:#fff;display:flex;align-items:center;gap:10px 16px;padding:10px 16px;flex-wrap:wrap}
.hud .tt{flex:1 1 180px;min-width:0}
.hud .tt b{display:block;font-size:15px;line-height:1.25}
.hud .tt span{font-size:11px;color:#DAF2F0;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.xp{display:flex;align-items:center;gap:10px;flex:1 1 260px;max-width:400px}
.lvl{flex:none;width:46px;height:46px;border-radius:14px;background:var(--ol);color:var(--dk);font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-size:19px}
.lvl small{font-size:8.5px;letter-spacing:.08em;margin-bottom:2px}
.xpbox{flex:1;min-width:0}
.xpbox .row{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#DAF2F0;margin-bottom:5px;gap:8px}
.bar{height:10px;border-radius:10px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ol),#FFD166);width:0;transition:width .6s cubic-bezier(.2,.7,.3,1);border-radius:10px}
.streak{font-weight:700;font-size:13px;background:rgba(255,255,255,.08);border-radius:20px;padding:7px 11px;white-space:nowrap;transition:background .2s}
.streak.hot{background:var(--ol);color:var(--dk)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tb{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:8px 11px;font-size:13px;font-weight:700;min-height:42px;white-space:nowrap}
.tb:hover{background:rgba(255,255,255,.18)}
.zoomg{display:flex;align-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:0 2px;color:#fff;font-size:13px;font-weight:700}
.zoomg span{padding:0 4px 0 8px}
.zoomg .tb{border:0;background:none;padding:8px 9px;font-size:16px}
.rail{display:flex;gap:6px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--ob);overflow-x:auto}
.dot{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--ob);background:#fff;border-radius:12px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--mu);white-space:nowrap;min-height:42px}
.dot.on{border-color:var(--o);color:var(--dk);background:var(--o1)}
.dot.ok{border-color:var(--ok);color:var(--ok)}
.dot.ok.on{background:var(--ok1)}
main{flex:1;display:flex;justify-content:center;padding:28px 18px 24px}
.slide{width:100%;max-width:1040px;display:none}
.slide.on{display:block;animation:sin .38s cubic-bezier(.2,.7,.3,1)}
@keyframes sin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ahead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--o);background:var(--o1);border:1.5px solid var(--ob);border-radius:30px;padding:7px 13px}
.pill.dk{color:var(--ol);background:color-mix(in srgb,var(--ol) 14%,transparent);border-color:color-mix(in srgb,var(--ol) 35%,transparent)}
.reward{font-weight:700;font-size:13px;color:var(--dk);background:#FFF4D6;border-radius:30px;padding:7px 12px;white-space:nowrap}
h1,h2{font-family:'Roca One',Georgia,serif;font-weight:400;color:var(--dk);line-height:1.08;margin:14px 0 10px;text-wrap:balance}
h1{font-size:clamp(38px,6.4vw,68px)}
h2{font-size:clamp(28px,4.4vw,44px)}
.hl{color:var(--o)}
.lead{font-size:clamp(16px,2vw,19px);line-height:1.55;max-width:62ch;margin:0 0 18px;text-wrap:pretty}
.do{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15.5px;color:var(--dk);margin:4px 0 16px}
.do b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--o);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:30px;padding:14px 24px;font-weight:700;font-size:16px;min-height:50px;background:var(--o);color:#fff;transition:transform .15s,background .15s}
.btn:hover{background:var(--oh)}.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--dk);border:2px solid var(--ob)}
.btn.ghost:hover{border-color:var(--o)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.hintb{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;margin-bottom:12px;background:#fff;border:2px solid var(--ob);border-radius:30px;padding:9px 15px;font-weight:700;font-size:14px;min-height:44px}
.hintb:hover{border-color:var(--o)}
.hintbox{display:none;background:#FFF8E6;border:2px dashed #F2C46B;border-radius:16px;padding:12px 16px;font-size:15px;line-height:1.5;margin:0 0 14px}
.hintbox.on{display:block;animation:sin .25s ease-out}
.card{background:#fff;border:2px solid var(--ob);border-radius:20px;padding:18px}
.fb{min-height:24px;font-weight:700;font-size:15px;margin:12px 0 0}
.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.shake{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.pop{animation:pp .35s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pp{0%{transform:scale(.85)}100%{transform:scale(1)}}
.glow{position:relative;z-index:2;box-shadow:0 0 0 3px var(--ol),0 0 0 9px color-mix(in srgb,var(--ol) 35%,transparent)!important;animation:glw 1.1s ease-in-out infinite}
@keyframes glw{50%{box-shadow:0 0 0 3px var(--ol),0 0 0 14px color-mix(in srgb,var(--ol) 12%,transparent)}}
.done{display:none;margin-top:18px;background:var(--dk);color:#fff;border-radius:20px;padding:16px 20px;align-items:center;gap:14px 20px;flex-wrap:wrap}
.done.on{display:flex;animation:sin .35s ease-out}
.done .t{flex:1 1 220px;font-weight:700;font-size:16px}
.done .t small{display:block;font-weight:400;color:#DAF2F0;font-size:13.5px;margin-top:2px}
.rate{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rate span{font-size:13px;color:#DAF2F0;margin-right:4px}
.rate button{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.22);border-radius:14px;padding:6px 10px;font-size:13px;font-weight:700;color:#fff;display:flex;align-items:center;gap:6px;min-height:44px}
.rate button i{font-style:normal;font-size:22px}
.rate button.sel{background:var(--ol);border-color:var(--ol);color:var(--dk)}
/* cover */
.cover{background:var(--dk);color:#fff;border-radius:28px;padding:clamp(26px,5vw,54px);position:relative;overflow:hidden}
.cover h1{color:#fff}.cover .lead{color:#DAF2F0}
.retos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:22px 0 26px}
.reto{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.reto i{font-style:normal;font-size:26px}
.reto b{display:block;font-size:14.5px}.reto small{color:#DAF2F0;font-size:12.5px}
.meta{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:14px;font-size:13.5px;color:#DAF2F0}
/* tutorial */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.opt{position:relative;text-align:left;background:#fff;border:2px solid var(--ob);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:10px;min-height:230px;transition:transform .2s,border-color .2s,box-shadow .2s}
.opt:hover{transform:translateY(-3px);border-color:var(--o);box-shadow:0 14px 30px rgba(0,31,25,.1)}
.opt .lab{font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--o)}
.opt .ic{width:64px;height:64px;border-radius:18px;background:var(--o1);display:flex;align-items:center;justify-content:center;font-size:32px}
.opt .nm{font-family:'Roca One',Georgia,serif;font-size:26px;color:var(--dk)}
.opt .ds{font-size:15px;line-height:1.5;color:var(--mu)}
.opt .go{margin-top:auto;font-weight:700;color:var(--o);font-size:15px}
.opt.ok{border-color:var(--ok)}.opt.ok .go{color:var(--ok)}
.fav{display:none;margin-top:14px}
.fav.on{display:block;animation:sin .3s ease-out}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#fff;border:2px solid var(--ob);border-radius:30px;padding:10px 16px;font-weight:700;font-size:14.5px;min-height:46px}
.chip:hover{border-color:var(--o)}
.chip.sel{background:var(--o);border-color:var(--o);color:#fff}
/* modal */
.modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal .scrim{position:absolute;inset:0;background:rgba(0,31,25,.62);backdrop-filter:blur(3px)}
.win{position:relative;background:#fff;border-radius:22px;width:min(1080px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.35);animation:win .3s cubic-bezier(.2,.8,.3,1)}
@keyframes win{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
.whd{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--dk);color:#fff}
.whd b{flex:1;font-size:15px}
.whd small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ol)}
.wbd{padding:16px;overflow:auto;flex:1}
.wft{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--ob)}
.vid{position:relative;width:100%;aspect-ratio:16/9;background:#0b1512;border-radius:14px;overflow:hidden}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#DAF2F0;text-align:center;padding:20px;font-size:15px}
.vid .ph i{font-style:normal;font-size:46px}
/* sim */
.simbar{display:flex;align-items:center;gap:12px;background:var(--o1);border:2px solid var(--ob);border-radius:16px;padding:10px 14px;margin-bottom:12px;flex-wrap:wrap}
.simbar .n{flex:none;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--o);border-radius:20px;padding:6px 11px}
.simbar .say{flex:1 1 240px;font-weight:700;font-size:16px;color:var(--dk);line-height:1.4}
.simdots{display:flex;gap:4px}
.simdots i{width:8px;height:8px;border-radius:8px;background:var(--ob);transition:all .2s}
.simdots i.on{width:20px;background:var(--o)}.simdots i.ok{background:var(--ok)}
.simstage{position:relative;border-radius:14px;overflow:hidden;border:1px solid #D9D9D9;background:#fff;user-select:none}
.simfb{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--dk);color:#fff;font-weight:700;font-size:14px;border-radius:30px;padding:9px 16px;display:none;z-index:9;white-space:nowrap}
.hand{position:absolute;z-index:8;font-size:30px;pointer-events:none;display:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));animation:hand .8s ease-in-out infinite}
@keyframes hand{50%{transform:translateY(-8px)}}
.simwin{display:none;text-align:center;padding:26px}
.simwin.on{display:block;animation:sin .3s ease-out}
/* drag */
[data-drag]{touch-action:none;cursor:grab}
.dchip{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--ob);border-radius:14px;padding:11px 14px;font-weight:700;font-size:15px;line-height:1.35;text-align:left;min-height:50px;transition:border-color .15s,background .15s,opacity .15s}
.dchip:hover{border-color:var(--o)}
.dchip.sel{border-color:var(--o);background:var(--o1);box-shadow:0 0 0 4px color-mix(in srgb,var(--ol) 30%,transparent)}
.dchip.lift{opacity:.35}
.dghost{position:fixed;z-index:300;pointer-events:none;transform:rotate(-2deg) scale(1.03);box-shadow:0 16px 30px rgba(0,31,25,.25);margin:0}
.over{border-color:var(--o)!important;background:var(--o1)!important}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border-radius:16px;background:#fff;border:2px dashed var(--ob);margin-bottom:14px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.bin{background:#fff;border:2px dashed var(--ob);border-radius:18px;padding:14px;min-height:150px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,background .15s}
.bin .bh{display:flex;align-items:center;gap:10px}
.bin .bh i{font-style:normal;font-size:26px}
.bin .bh b{display:block;font-size:16px;color:var(--dk)}.bin .bh small{font-size:13px;color:var(--mu)}
.inb{background:var(--ok1);border:1.5px solid var(--ok);border-radius:10px;padding:7px 10px;font-size:13.5px;font-weight:700;color:var(--dk)}
/* order */
.olist{display:flex;flex-direction:column;gap:8px;counter-reset:o}
.olist .dchip{counter-increment:o}
.olist .dchip:before{content:counter(o);flex:none;width:30px;height:30px;border-radius:50%;background:var(--o1);color:var(--o);display:flex;align-items:center;justify-content:center;font-size:14px}
.olist .dchip.good{border-color:var(--ok);background:var(--ok1)}
.olist .dchip.good:before{background:var(--ok);color:#fff}
.olist .dchip.bad{border-color:var(--bad);background:var(--bad1)}
.olist .grip{margin-left:auto;color:#B9A89A;font-size:18px}
/* memory */
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mc{perspective:800px;border:0;background:none;padding:0;min-height:120px}
.mc{display:block;width:100%}
.mc .in{display:block;position:relative;width:100%;height:100%;min-height:120px;transition:transform .45s cubic-bezier(.2,.7,.3,1);transform-style:preserve-3d}
.mc.up .in,.mc.got .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-weight:700;font-size:14.5px;line-height:1.35}
.mc .f{background:var(--dk);color:var(--ol);font-size:30px;border:2px solid var(--dk)}
.mc .b{background:#fff;border:2px solid var(--ob);color:var(--dk);transform:rotateY(180deg)}
.mc .b.t{background:var(--o1);border-color:var(--o)}
.mc.got .b{background:var(--ok1);border-color:var(--ok)}
/* quiz */
.qopts{display:grid;gap:10px}
.qo{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:2px solid var(--ob);border-radius:16px;padding:14px 16px;font-size:16px;line-height:1.4;min-height:58px}
.qo:hover{border-color:var(--o)}
.qo b{flex:none;width:32px;height:32px;border-radius:10px;background:var(--o1);color:var(--o);display:flex;align-items:center;justify-content:center}
.qo.good{border-color:var(--ok);background:var(--ok1)}.qo.bad{border-color:var(--bad);background:var(--bad1)}
.qcount{font-weight:700;font-size:13px;color:var(--mu);margin-bottom:8px}
.qq{font-family:'Roca One',Georgia,serif;font-size:clamp(21px,2.8vw,27px);color:var(--dk);line-height:1.25;margin:0 0 14px}
/* fill */
.fill p{font-size:clamp(17px,2.2vw,20px);line-height:2.1;margin:0 0 6px}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:120px;min-height:42px;vertical-align:middle;border:2px dashed var(--o);background:var(--o1);border-radius:12px;padding:2px 12px;font-weight:700;font-size:16px;color:var(--o);margin:0 3px}
.blank.okd{border-style:solid;border-color:var(--ok);background:var(--ok1);color:var(--dk)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding:12px;border-radius:16px;background:#fff;border:2px solid var(--ob)}
.bank .dchip{min-height:44px;padding:8px 14px}
/* flip */
.flip{perspective:1200px;max-width:640px;margin:0 auto}
.flip .in{position:relative;transition:transform .55s cubic-bezier(.2,.7,.3,1);transform-style:preserve-3d;min-height:360px}
.flip.up .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px}
.flip .f{background:#fff;border:2px solid var(--ob)}
.flip .b{background:var(--dk);color:#fff;transform:rotateY(180deg);justify-content:center;text-align:center}
.ba{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--bg);border-radius:16px;padding:16px}
.ba > div{background:#fff;border:1px solid var(--ob);border-radius:12px;min-height:86px;display:flex;align-items:center;justify-content:center;padding:10px;text-align:center;position:relative}
.ba small{position:absolute;top:6px;left:8px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.ba > span{font-size:22px;color:var(--o);font-weight:700}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
/* word search */
.ws{display:grid;gap:18px;grid-template-columns:minmax(0,auto) minmax(200px,1fr);align-items:start}
@media(max-width:720px){.ws{grid-template-columns:1fr}}
.wgrid{display:grid;gap:4px;touch-action:none;user-select:none;width:min(520px,100%)}
.wc{aspect-ratio:1;border:0;border-radius:8px;background:#fff;font-weight:700;font-size:clamp(14px,2.2vw,20px);color:var(--dk);box-shadow:inset 0 0 0 1.5px var(--ob);padding:0}
.wc.tmp{background:var(--ol);color:var(--dk)}
.wc.got{background:var(--ok);color:#fff;box-shadow:none}
.wc.start{background:var(--o1);box-shadow:inset 0 0 0 2px var(--o)}
.wlist{display:flex;flex-direction:column;gap:8px}
.wlist span{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--ob);border-radius:14px;padding:10px 14px;font-weight:700;letter-spacing:.06em}
.wlist span.got{border-color:var(--ok);background:var(--ok1);text-decoration:line-through;color:var(--ok)}
.wlist span i{font-style:normal;font-size:20px;letter-spacing:0}
/* scratch */
.scr{position:relative;border-radius:22px;overflow:hidden;max-width:420px;margin:0 auto;touch-action:none}
.scr canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;transition:opacity .5s}
/* phone */
.phone{width:min(300px,100%);margin:0 auto;background:#111;border-radius:36px;padding:10px;box-shadow:0 20px 40px rgba(0,31,25,.2)}
.phone .scrn{background:#fff;border-radius:28px;overflow:hidden;min-height:460px;display:flex;flex-direction:column}
.slot{margin:6px 10px;border:2px dashed #CFC3B8;border-radius:12px;min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12.5px;color:var(--mu);padding:6px 10px;background:#FCFAF8;transition:all .15s}
.slot.filled{border:0;padding:0;background:none;display:block}
/* nav */
.nav{position:sticky;bottom:0;z-index:40;background:rgba(251,246,241,.96);backdrop-filter:blur(6px);border-top:1px solid var(--ob);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px}
